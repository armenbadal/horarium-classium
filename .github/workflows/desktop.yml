name: Windows MSI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/student/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Build MSI
        run: npm run tauri build -- --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: horarium-windows-msi
          path: apps/student/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
