name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/student
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/student/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - name: Check release version
        run: npm run check:release-version -- "${{ github.ref_name }}"
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build MSI
        run: npm run tauri build -- --bundles msi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Horarium Classium ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: apps/student/src-tauri/target/release/bundle/msi/*.msi
